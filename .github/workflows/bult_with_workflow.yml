# .github/workflows/built_with_captcha_solver.yml

name: BuiltWith Scraper

on:
  workflow_dispatch:
    inputs:
      domains_file:
        description: "Repo path to domains CSV"
        required: true
        default: "built_with/data/domains.csv"
        type: string

      domains_per_job:
        description: "MAX domains per worker"
        required: true
        default: "5"
        type: string

      max_parallel_jobs:
        description: "Max concurrent matrix jobs"
        required: true
        default: "10"
        type: string


permissions:
  contents: read


jobs:

  # ============================================================
  # 1. LOAD DOMAINS
  # ============================================================

  load:
    runs-on: ubuntu-latest

    outputs:
      total: ${{ steps.load.outputs.total }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Load and normalize domains
        id: load
        run: |
          python - <<'PY'
          import csv
          import os
          import sys

          in_path = "${{ inputs.domains_file }}"

          print(f"Reading domains from: {in_path}")

          if not os.path.isfile(in_path):
              print(f"ERROR: domains_file not found: {in_path}")
              sys.exit(1)

          seen = set()
          domains = []

          with open(in_path, "r", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)

              print("CSV columns:", reader.fieldnames)

              for row in reader:
                  d = (
                      row.get("domain")
                      or row.get("url")
                      or ""
                  ).strip().lower()

                  d = (
                      d.replace("https://", "")
                       .replace("http://", "")
                       .split("/")[0]
                  )

                  if d and d not in seen:
                      seen.add(d)
                      domains.append(d)

          os.makedirs("domain_data", exist_ok=True)

          output_path = "domain_data/all_domains.csv"

          with open(
              output_path,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow(["domain"])

              writer.writerows(
                  [[domain] for domain in domains]
              )

          print(f"Total unique domains: {len(domains)}")

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  f"total={len(domains)}\n"
              )

          PY


      - name: Upload normalized domains
        uses: actions/upload-artifact@v4
        with:
          name: all_domains
          path: domain_data/all_domains.csv
          retention-days: 2



  # ============================================================
  # 2. PLAN / CREATE CHUNKS
  # ============================================================

  plan:
    needs: load

    if: ${{ needs.load.outputs.total != '0' && needs.load.outputs.total != '' }}

    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      chunk_count: ${{ steps.chunk.outputs.chunk_count }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Download normalized domains
        uses: actions/download-artifact@v4
        with:
          name: all_domains
          path: domain_data


      - name: Split domains into chunks
        id: chunk
        run: |
          python - <<'PY'

          import csv
          import json
          import math
          import os

          from pathlib import Path


          MAX_PER_JOB = max(
              1,
              int("${{ inputs.domains_per_job }}" or "5")
          )

          MAX_JOBS = max(
              1,
              int("${{ inputs.max_parallel_jobs }}" or "10")
          )


          domains = []

          with open(
              "domain_data/all_domains.csv",
              encoding="utf-8-sig"
          ) as f:

              for row in csv.DictReader(f):

                  domain = (
                      row.get("domain")
                      or ""
                  ).strip().lower()

                  if domain:
                      domains.append(domain)


          n = len(domains)


          chunk_size = min(
              MAX_PER_JOB,
              max(
                  1,
                  math.ceil(n / MAX_JOBS)
              )
          )


          chunks = [
              domains[i:i + chunk_size]
              for i in range(
                  0,
                  n,
                  chunk_size
              )
          ]


          Path("chunks").mkdir(
              exist_ok=True
          )


          matrix = []


          for i, group in enumerate(chunks):

              path = f"chunks/domains_{i}.csv"

              with open(
                  path,
                  "w",
                  newline="",
                  encoding="utf-8"
              ) as f:

                  writer = csv.writer(f)

                  writer.writerow(["domain"])

                  writer.writerows(
                      [[domain] for domain in group]
                  )


              matrix.append({
                  "index": i,
                  "chunk": path,
                  "count": len(group)
              })


          print(
              f"Plan: {len(matrix)} chunks "
              f"(~{chunk_size} domains each)"
          )


          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  "matrix="
                  + json.dumps({
                      "include": matrix
                  })
                  + "\n"
              )

              output.write(
                  f"chunk_count={len(matrix)}\n"
              )

          PY


      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: chunks
          path: chunks/
          retention-days: 2



  # ============================================================
  # 3. PROCESS
  # ============================================================

  process:

    needs: plan

    if: ${{ needs.plan.outputs.chunk_count != '0' }}

    continue-on-error: true

    runs-on: ubuntu-latest

    timeout-minutes: 120


    strategy:

      fail-fast: false

      max-parallel: ${{ fromJSON(inputs.max_parallel_jobs) }}

      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}


    name: process(${{ matrix.index }}, ${{ matrix.count }} domains)


    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: built_with/requirements.txt


      # ----------------------------------------------------------
      # Python dependencies
      # ----------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r built_with/requirements.txt


      # ----------------------------------------------------------
      # Playwright
      # ----------------------------------------------------------

      - name: Install Playwright Chromium
        run: |
          playwright install chromium --with-deps


      # ----------------------------------------------------------
      # Xvfb
      # ----------------------------------------------------------

      - name: Install Xvfb
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb


      # ----------------------------------------------------------
      # Download chunks
      # ----------------------------------------------------------

      - name: Download domain chunks
        uses: actions/download-artifact@v4
        with:
          name: chunks
          path: chunks


      # ----------------------------------------------------------
      # Run scraper
      # ----------------------------------------------------------

      - name: Run BuiltWith scraper

        env:
          DISPLAY: :99
          HF_HUB_DISABLE_TELEMETRY: "1"

        run: |

          set -euo pipefail


          # ------------------------------------------------------
          # Start virtual display
          # ------------------------------------------------------

          Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension GLX \
            +render \
            -noreset &


          XVFB_PID=$!


          trap '
            kill $XVFB_PID 2>/dev/null || true
          ' EXIT


          sleep 2


          # ------------------------------------------------------
          # Prepare worker files
          # ------------------------------------------------------

          mkdir -p outputs


          cp \
            "${{ matrix.chunk }}" \
            domains.csv


          echo "Worker input:"
          cat domains.csv


          # ------------------------------------------------------
          # Force headless=True for GitHub Actions
          # ------------------------------------------------------

          python -u - <<'PY'

          script_path = "built_with/built_with_captcha_solver.py"

          with open(
              script_path,
              "r",
              encoding="utf-8"
          ) as f:

              code = f.read()


          code = code.replace(
              "headless=False",
              "headless=True"
          )


          with open(
              script_path,
              "w",
              encoding="utf-8"
          ) as f:

              f.write(code)

          PY


          # ------------------------------------------------------
          # Run scraper
          # ------------------------------------------------------

          python -u built_with/built_with_captcha_solver.py


          # ------------------------------------------------------
          # Rename worker output
          # ------------------------------------------------------

          if [ -f builtwith_results.csv ]; then

              mv \
                builtwith_results.csv \
                "outputs/out_${{ matrix.index }}.csv"

          else

              echo "WARNING: builtwith_results.csv not generated"

              echo \
                "domain,company_name,error" \
                > "outputs/out_${{ matrix.index }}.csv"

          fi


          # ------------------------------------------------------
          # Detect pending / failed domains
          # ------------------------------------------------------

          python - <<'PY'

          import csv

          from pathlib import Path


          out_path = Path(
              "outputs/out_${{ matrix.index }}.csv"
          )

          pend_path = Path(
              "outputs/pend_${{ matrix.index }}.csv"
          )


          pending = []


          if out_path.exists():

              with open(
                  out_path,
                  encoding="utf-8-sig"
              ) as f:

                  reader = csv.DictReader(f)


                  for row in reader:

                      domain = (
                          row.get("domain")
                          or ""
                      ).strip()


                      error = (
                          row.get("error")
                          or ""
                      ).strip()


                      company = (
                          row.get("company_name")
                          or ""
                      ).strip()


                      tech = (
                          row.get("technology")
                          or ""
                      ).strip()


                      if (
                          error
                          or (
                              not company
                              and tech in (
                                  "",
                                  "[]",
                                  "null"
                              )
                          )
                      ):

                          if domain:
                              pending.append(domain)


          else:

              with open(
                  "domains.csv",
                  encoding="utf-8-sig"
              ) as f:

                  for row in csv.DictReader(f):

                      domain = (
                          row.get("domain")
                          or ""
                      ).strip()

                      if domain:
                          pending.append(domain)


          with open(
              pend_path,
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow(["domain"])

              writer.writerows(
                  [[domain] for domain in pending]
              )


          print(
              "Worker ${{ matrix.index }}: "
              f"{len(pending)} pending domains"
          )

          PY


      # ----------------------------------------------------------
      # Upload worker results
      # ----------------------------------------------------------

      - name: Upload worker results

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: result-${{ matrix.index }}

          path: |
            outputs/out_${{ matrix.index }}.csv
            outputs/pend_${{ matrix.index }}.csv

          if-no-files-found: warn

          retention-days: 5



  # ============================================================
  # 4. FINAL AGGREGATE
  # ============================================================

  final-aggregate:

    needs: process

    if: always()

    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Download all worker results
      # ----------------------------------------------------------

      - name: Download all worker results

        uses: actions/download-artifact@v4

        with:
          pattern: result-*
          path: all_results
          merge-multiple: true


      # ----------------------------------------------------------
      # Merge
      # ----------------------------------------------------------

      - name: Merge results and pending domains

        id: merge

        run: |

          python - <<'PY'

          import csv
          import os

          from pathlib import Path


          final = Path("final")

          final.mkdir(
              exist_ok=True
          )


          header = None


          success = []
          seen_success = set()


          pending = []
          seen_pending = set()


          # ------------------------------------------------------
          # Read worker files
          # ------------------------------------------------------

          for root, _, files in os.walk(
              "all_results"
          ):

              for name in files:

                  path = Path(root) / name


                  # ----------------------------------------------
                  # Worker result
                  # ----------------------------------------------

                  if (
                      name.startswith("out_")
                      and name.endswith(".csv")
                  ):

                      with open(
                          path,
                          encoding="utf-8-sig"
                      ) as f:

                          reader = csv.reader(f)

                          current_header = next(
                              reader,
                              None
                          )


                          if (
                              current_header
                              and header is None
                          ):
                              header = current_header


                          for row in reader:

                              if not row:
                                  continue


                              key = tuple(row)


                              if key in seen_success:
                                  continue


                              seen_success.add(key)

                              success.append(row)


                  # ----------------------------------------------
                  # Pending
                  # ----------------------------------------------

                  elif (
                      name.startswith("pend_")
                      and name.endswith(".csv")
                  ):

                      with open(
                          path,
                          encoding="utf-8-sig"
                      ) as f:

                          for row in csv.DictReader(f):

                              domain = (
                                  row.get("domain")
                                  or ""
                              ).strip()


                              if (
                                  domain
                                  and domain not in seen_pending
                              ):

                                  seen_pending.add(domain)

                                  pending.append(domain)


          # ------------------------------------------------------
          # Final result
          # ------------------------------------------------------

          with open(
              final / "builtwith_results.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)


              writer.writerow(
                  header
                  or [
                      "domain",
                      "company_name",
                      "linkedin_site",
                      "company_image",
                      "location",
                      "telephone",
                      "listed_contacts",
                      "vertical",
                      "company_data",
                      "google_data",
                      "performance_data",
                      "social_links",
                      "emails",
                      "traffic_rankings",
                      "technology_spend",
                      "technology",
                      "updated_at"
                  ]
              )


              writer.writerows(success)


          # ------------------------------------------------------
          # Pending URLs
          # ------------------------------------------------------

          with open(
              final / "pending_urls.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as f:

              writer = csv.writer(f)

              writer.writerow(["domain"])

              writer.writerows(
                  [[domain] for domain in pending]
              )


          # ------------------------------------------------------
          # Statistics
          # ------------------------------------------------------

          print(
              f"FINAL success rows: {len(success)}"
          )

          print(
              f"FINAL pending domains: {len(pending)}"
          )


          # ------------------------------------------------------
          # Outputs
          # ------------------------------------------------------

          with open(
              os.environ["GITHUB_OUTPUT"],
              "a",
              encoding="utf-8"
          ) as output:

              output.write(
                  f"success_count={len(success)}\n"
              )

              output.write(
                  f"pending_count={len(pending)}\n"
              )


          # ------------------------------------------------------
          # GitHub summary
          # ------------------------------------------------------

          with open(
              os.environ.get(
                  "GITHUB_STEP_SUMMARY",
                  "/dev/null"
              ),
              "a",
              encoding="utf-8"
          ) as summary:

              summary.write(
                  "### BuiltWith Scraper Result\n"
              )

              summary.write(
                  f"- Success rows: **{len(success)}**\n"
              )

              summary.write(
                  f"- Pending domains: **{len(pending)}**\n"
              )

          PY


      # ----------------------------------------------------------
      # Upload final output
      # ----------------------------------------------------------

      - name: Upload final artifacts

        if: always()

        uses: actions/upload-artifact@v4

        with:

          name: builtwith_outputs

          path: |
            final/builtwith_results.csv
            final/pending_urls.csv

          retention-days: 7