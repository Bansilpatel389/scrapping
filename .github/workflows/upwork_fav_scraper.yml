name: Upwork Fav Scraper

on:
  workflow_dispatch:
    inputs:
      frequency:
        description: "How often the job should effectively run"
        required: true
        default: "daily"
        type: choice
        options:
          - hourly
          - daily
          - every-6-hours
          - once
      number_of_days:
        description: "How many days this run should keep the scraper alive"
        required: true
        default: "1"
        type: choice
        options:
          - "1"
          - "2"
          - "3"
          - "7"
      script_to_run:
        description: "Which script to execute"
        required: true
        default: "with_logging"
        type: choice
        options:
          - with_logging
          - without_logging
          - both
      max_runtime_hours:
        description: "Hard timeout in hours"
        required: true
        default: "6"
        type: choice
        options:
          - "2"
          - "4"
          - "6"
          - "12"

  schedule:
    - cron: "30 0 * * *"

jobs:
  scrape:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Chrome + display + ssh)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            xvfb x11-utils libgtk-3-0 libnss3 libxss1 libasound2 \
            fonts-liberation libappindicator3-1 libu2f-udev libvulkan1 \
            wget gnupg ca-certificates unzip openssh-client

          wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          sudo apt-get install -y /tmp/chrome.deb || true
          google-chrome --version || true

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install -r upwork_fav/requirements.txt
          pip install pymysql cryptography SQLAlchemy python-dotenv

      - name: Setup SSH key and start MySQL tunnel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts

          # Start SSH tunnel in background: local 3307 → remote 127.0.0.1:3306
          ssh -f -N -o StrictHostKeyChecking=no \
              -L 3307:127.0.0.1:3306 \
              -i ~/.ssh/id_ed25519 \
              ${SSH_USER}@${SSH_HOST}

          # Wait a moment and test the tunnel
          sleep 3
          nc -zv 127.0.0.1 3307 || (echo "Tunnel failed!" && exit 1)
          echo "✅ SSH tunnel is up on localhost:3307"

      - name: Show chosen parameters
        run: |
          echo "Frequency          : ${{ github.event.inputs.frequency || 'daily (schedule)' }}"
          echo "Number of days     : ${{ github.event.inputs.number_of_days || '1' }}"
          echo "Script to run      : ${{ github.event.inputs.script_to_run || 'with_logging' }}"
          echo "Max runtime (h)    : ${{ github.event.inputs.max_runtime_hours || '6' }}"

      - name: Run scraper under Xvfb (separate displays)
        env:
          # Force the scripts to use the local tunnel
          MYSQL_HOST: "127.0.0.1"
          MYSQL_PORT: "3307"
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASS: ${{ secrets.MYSQL_PASS }}
          MYSQL_DB:   ${{ secrets.MYSQL_DB }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASS }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DB }}
          PYTHONUNBUFFERED: "1"
        run: |
          # Create Xauthority file (fixes pyautogui error)
          touch $HOME/.Xauthority
          chmod 600 $HOME/.Xauthority

          SCRIPT_CHOICE="${{ github.event.inputs.script_to_run || 'with_logging' }}"
          MAX_HOURS="${{ github.event.inputs.max_runtime_hours || '6' }}"
          DAYS="${{ github.event.inputs.number_of_days || '1' }}"

          RUNTIME_SECONDS=$(( DAYS * 24 * 3600 ))
          MAX_SECONDS=$(( MAX_HOURS * 3600 ))
          if [ $RUNTIME_SECONDS -gt $MAX_SECONDS ]; then
            RUNTIME_SECONDS=$MAX_SECONDS
          fi

          echo "Will run for up to ${RUNTIME_SECONDS} seconds"
          echo "MySQL Host: $MYSQL_HOST"
          echo "MySQL Port: $MYSQL_PORT"
          echo "MySQL DB  : $MYSQL_DB"

          cd upwork_fav

          run_one () {
            local script=$1
            local display=$2
            echo "===== Starting $script on DISPLAY=$display ====="

            Xvfb $display -screen 0 1600x900x24 -ac +extension GLX +render -noreset &
            local xvfb_pid=$!
            sleep 2

            DISPLAY=$display timeout --foreground --signal=TERM --kill-after=30s ${RUNTIME_SECONDS}s \
              python -u "$script" || true

            kill $xvfb_pid 2>/dev/null || true
            echo "===== Finished $script ====="
          }

          case "$SCRIPT_CHOICE" in
            with_logging)
              run_one upwork_profile_fav_with_logging.py :99
              ;;
            without_logging)
              run_one upwork_profile_fav_without_logging.py :99
              ;;
            both)
              run_one upwork_profile_fav_with_logging.py :99 &
              PID1=$!
              run_one upwork_profile_fav_without_logging.py :100 &
              PID2=$!
              wait $PID1 $PID2
              ;;
          esac

      - name: Upload logs / artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-logs-${{ github.run_id }}
          path: |
            upwork_fav/*.log
            upwork_fav/*.json
          if-no-files-found: ignore
          retention-days: 7