# version 3

name: Google Shopping Workflow selenium

on:
  workflow_dispatch:
    inputs:
      urls_file:
        description: "Repo path to CSV of URLs. Example: google_shopping_scrap/data/urls.csv"
        required: true
        default: "google_shopping_scrap/data/urls.csv"
        type: string
      urls_per_job:
        description: "MAX URLs per worker (never exceeded)"
        required: true
        default: "10"
        type: string
      max_parallel_jobs:
        description: "Max concurrent matrix jobs"
        required: true
        default: "20"
        type: string
      flush_every:
        description: "Flush progress every N output rows"
        required: true
        default: "25"
        type: string
      max_pending_rounds:
        description: "Max total waves (1 = first pass only … 5 = first pass + 4 retries). Hard-capped at 5."
        required: true
        default: "5"
        type: string

permissions:
  contents: read

# ---------------------------------------------------------------------------
# Chunking rules (same as original):
#   max_per_job = urls_per_job
#   max_jobs    = max_parallel_jobs
#   chunk_size  = min(max_per_job, ceil(n / max_jobs))
#   jobs        = ceil(n / chunk_size)
# ---------------------------------------------------------------------------

jobs:
  # ============================================================
  # 1. LOAD
  # ============================================================
  load:
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.load.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - name: Load and normalize URL list
        id: load
        run: |
          python - <<'PY'
          import csv, os, sys
          in_path = "${{ inputs.urls_file }}"
          if not os.path.isfile(in_path):
              print(f"ERROR: urls_file not found: {in_path}")
              sys.exit(1)
          seen, urls = set(), []
          with open(in_path, "r", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              print("CSV columns:", reader.fieldnames)
              for row in reader:
                  u = (row.get("product_url") or row.get("url") or "").strip()
                  if u and u.startswith(("http://", "https://")) and u not in seen:
                      seen.add(u)
                      urls.append(u)
          os.makedirs("url_data", exist_ok=True)
          with open("url_data/all_urls.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["product_url"])
              w.writerows([[u] for u in urls])
          print(f"Total unique URLs: {len(urls)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"total={len(urls)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all_urls
          path: url_data/all_urls.csv
          retention-days: 2

  # ============================================================
  # WAVE 1 — plan
  # ============================================================
  plan-1:
    needs: load
    if: ${{ needs.load.outputs.total != '0' && needs.load.outputs.total != '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      chunk_count: ${{ steps.chunk.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: all_urls
          path: url_data
      - name: Split into chunks
        id: chunk
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          MAX_PER_JOB = max(1, int("${{ inputs.urls_per_job }}" or "10"))
          MAX_JOBS    = max(1, int("${{ inputs.max_parallel_jobs }}" or "20"))
          urls = []
          with open("url_data/all_urls.csv", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  u = (row.get("product_url") or row.get("url") or "").strip()
                  if u: urls.append(u)
          n = len(urls)
          chunk_size = min(MAX_PER_JOB, max(1, math.ceil(n / MAX_JOBS)))
          chunks = [urls[i:i+chunk_size] for i in range(0, n, chunk_size)]
          Path("chunks").mkdir(exist_ok=True)
          matrix = []
          for i, group in enumerate(chunks):
              path = f"chunks/urls_{i}.csv"
              with open(path, "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in group])
              matrix.append({"index": i, "chunk": path, "count": len(group)})
          print(f"Wave 1: {len(matrix)} chunks (≈{chunk_size} URLs each)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"matrix={json.dumps({'include': matrix})}\n")
              o.write(f"chunk_count={len(matrix)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-1
          path: chunks/
          retention-days: 2

  # ============================================================
  # WAVE 1 — process (matrix)
  # ============================================================
  process-1:
    needs: plan-1
    if: ${{ needs.plan-1.outputs.chunk_count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel_jobs) }}
      matrix: ${{ fromJSON(needs.plan-1.outputs.matrix) }}
    env:
      HEADLESS: "1"
      BROWSER_ACCEPT_LANGUAGE: "en-US,en;q=0.9"
      BROWSER_TIMEZONE: "America/New_York"
      AUTOMATION_BLOCK_WAIT: "15"
      AUTOMATION_BLOCK_MAX: "2"
