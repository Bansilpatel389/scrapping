
# version 4

name: Google Shopping Workflow selenium

on:
  workflow_dispatch:
    inputs:
      urls_file:
        description: "Repo path to CSV of URLs. Example: google_shopping_scrap/data/urls.csv"
        required: true
        default: "google_shopping_scrap/data/urls.csv"
        type: string
      urls_per_job:
        description: "MAX URLs per worker (never exceeded)"
        required: true
        default: "10"
        type: string
      max_parallel_jobs:
        description: "Max concurrent matrix jobs"
        required: true
        default: "20"
        type: string
      flush_every:
        description: "Flush progress every N output rows"
        required: true
        default: "25"
        type: string
      max_pending_rounds:
        description: "Max total waves (1 = first pass only … 5 = first pass + 4 retries). Hard-capped at 5."
        required: true
        default: "5"
        type: string

permissions:
  contents: read

jobs:
  # ============================================================
  # 1. LOAD
  # ============================================================
  load:
    runs-on: ubuntu-latest
    outputs:
      total: ${{ steps.load.outputs.total }}
    steps:
      - uses: actions/checkout@v4
      - name: Load and normalize URL list
        id: load
        run: |
          python - <<'PY'
          import csv, os, sys
          in_path = "${{ inputs.urls_file }}"
          if not os.path.isfile(in_path):
              print(f"ERROR: urls_file not found: {in_path}")
              sys.exit(1)
          seen, urls = set(), []
          with open(in_path, "r", encoding="utf-8-sig") as f:
              reader = csv.DictReader(f)
              print("CSV columns:", reader.fieldnames)
              for row in reader:
                  u = (row.get("product_url") or row.get("url") or "").strip()
                  if u and u.startswith(("http://", "https://")) and u not in seen:
                      seen.add(u)
                      urls.append(u)
          os.makedirs("url_data", exist_ok=True)
          with open("url_data/all_urls.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["product_url"])
              w.writerows([[u] for u in urls])
          print(f"Total unique URLs: {len(urls)}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"total={len(urls)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: all_urls
          path: url_data/all_urls.csv
          retention-days: 2

  # ============================================================
  # WAVE 1 — plan
  # ============================================================
  plan-1:
    needs: load
    if: ${{ needs.load.outputs.total != '0' && needs.load.outputs.total != '' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      chunk_count: ${{ steps.chunk.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: all_urls
          path: url_data
      - name: Split into chunks
        id: chunk
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          MAX_PER_JOB = max(1, int("${{ inputs.urls_per_job }}" or "10"))
          MAX_JOBS    = max(1, int("${{ inputs.max_parallel_jobs }}" or "20"))
          urls = []
          with open("url_data/all_urls.csv", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  u = (row.get("product_url") or row.get("url") or "").strip()
                  if u: urls.append(u)
          n = len(urls)
          chunk_size = min(MAX_PER_JOB, max(1, math.ceil(n / MAX_JOBS)))
          chunks = [urls[i:i+chunk_size] for i in range(0, n, chunk_size)]
          Path("chunks").mkdir(exist_ok=True)
          matrix = []
          for i, group in enumerate(chunks):
              path = f"chunks/urls_{i}.csv"
              with open(path, "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in group])
              matrix.append({"index": i, "chunk": path, "count": len(group)})
          print(f"Wave 1: {len(matrix)} chunks (≈{chunk_size} URLs each)")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"matrix={json.dumps({'include': matrix})}\n")
              o.write(f"chunk_count={len(matrix)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-1
          path: chunks/
          retention-days: 2

  # ============================================================
  # WAVE 1 — process (matrix)
  # ============================================================
  process-1:
    needs: plan-1
    if: ${{ needs.plan-1.outputs.chunk_count != '0' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel_jobs) }}
      matrix: ${{ fromJSON(needs.plan-1.outputs.matrix) }}
    env:
      HEADLESS: "1"
      BROWSER_ACCEPT_LANGUAGE: "en-US,en;q=0.9"
      BROWSER_TIMEZONE: "America/New_York"
      AUTOMATION_BLOCK_WAIT: "15"
      AUTOMATION_BLOCK_MAX: "2"
    name: process-1(${{ matrix.index }}, ${{ matrix.chunk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_shopping_scrap/requirements.txt
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r google_shopping_scrap/requirements.txt
      - name: Setup Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - name: Export Chrome path
        run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - name: Install Xvfb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: actions/download-artifact@v4
        with:
          name: chunks-1
          path: chunks
      - name: Run scraper
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!
          trap 'kill $XVFB_PID 2>/dev/null || true' EXIT
          sleep 2
          mkdir -p outputs
          python -u google_shopping_scrap/collect_set_simple_from_urls_selenium.py \
            --urls "${{ matrix.chunk }}" \
            --out  "outputs/out_${{ matrix.index }}.csv" \
            --pending-out "outputs/pend_${{ matrix.index }}.csv" \
            --flush-every "${{ inputs.flush_every }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-1-${{ matrix.index }}
          path: |
            outputs/out_${{ matrix.index }}.csv
            outputs/pend_${{ matrix.index }}.csv
          if-no-files-found: warn
          retention-days: 5

  # ============================================================
  # WAVE 1 — aggregate
  # ============================================================
  aggregate-1:
    needs: process-1
    if: always()
    runs-on: ubuntu-latest
    outputs:
      pending_count: ${{ steps.merge.outputs.pending_count }}
      do_next: ${{ steps.merge.outputs.do_next }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-1-*
          path: all_results
          merge-multiple: true
      - name: Merge wave 1
        id: merge
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          out = Path("wave1"); out.mkdir(exist_ok=True)
          header = None
          success, seen_r, pending, seen_p = [], set(), [], set()
          for root, _, files in os.walk("all_results"):
              for name in files:
                  path = Path(root) / name
                  if name.startswith("out_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          r = csv.reader(f); h = next(r, None)
                          if h and header is None: header = h
                          for row in r:
                              if not row: continue
                              key = tuple(row)
                              if key in seen_r: continue
                              seen_r.add(key); success.append(row)
                  elif name.startswith("pend_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          for row in csv.DictReader(f):
                              u = (row.get("product_url") or row.get("url") or "").strip()
                              if u and u not in seen_p:
                                  seen_p.add(u); pending.append(u)
          with open(out / "success.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(header or ["url","name","image_url","price","seller","pid","cid","gid"])
              w.writerows(success)
          with open(out / "pending.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in pending])
          max_rounds = min(5, max(1, int("${{ inputs.max_pending_rounds }}" or "5")))
          do_next = "true" if (len(pending) > 0 and max_rounds >= 2) else "false"
          print(f"Wave 1: {len(success)} success, {len(pending)} pending → next={do_next}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"pending_count={len(pending)}\n")
              o.write(f"do_next={do_next}\n")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as s:
              s.write(f"### Wave 1\n- success: {len(success)}\n- pending: {len(pending)}\n- do_next: `{do_next}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave-1
          path: wave1/
          retention-days: 5

  # ============================================================
  # WAVE 2
  # ============================================================
  plan-2:
    needs: aggregate-1
    if: ${{ always() && needs.aggregate-1.result == 'success' && needs.aggregate-1.outputs.do_next == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      chunk_count: ${{ steps.chunk.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wave-1
          path: wave1
      - name: Chunk pending
        id: chunk
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          MAX_PER_JOB = max(1, int("${{ inputs.urls_per_job }}" or "10"))
          MAX_JOBS    = max(1, int("${{ inputs.max_parallel_jobs }}" or "20"))
          urls = []
          with open("wave1/pending.csv", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  u = (row.get("product_url") or row.get("url") or "").strip()
                  if u: urls.append(u)
          n = len(urls)
          if n == 0:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
                  o.write('matrix={"include":[]}\n')
                  o.write("chunk_count=0\n")
              raise SystemExit(0)
          chunk_size = min(MAX_PER_JOB, max(1, math.ceil(n / MAX_JOBS)))
          chunks = [urls[i:i+chunk_size] for i in range(0, n, chunk_size)]
          Path("chunks").mkdir(exist_ok=True)
          matrix = []
          for i, g in enumerate(chunks):
              p = f"chunks/urls_{i}.csv"
              with open(p, "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in g])
              matrix.append({"index": i, "chunk": p, "count": len(g)})
          print(f"Wave 2: {len(matrix)} chunks from {n} pending")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"matrix={json.dumps({'include': matrix})}\n")
              o.write(f"chunk_count={len(matrix)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-2
          path: chunks/
          retention-days: 2

  process-2:
    needs: plan-2
    if: ${{ always() && needs.plan-2.result == 'success' && needs.plan-2.outputs.chunk_count != '0' && needs.plan-2.outputs.chunk_count != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel_jobs) }}
      matrix: ${{ fromJSON(needs.plan-2.outputs.matrix) }}
    env:
      HEADLESS: "1"
      BROWSER_ACCEPT_LANGUAGE: "en-US,en;q=0.9"
      BROWSER_TIMEZONE: "America/New_York"
      AUTOMATION_BLOCK_WAIT: "20"
      AUTOMATION_BLOCK_MAX: "2"
    name: process-2(${{ matrix.index }}, ${{ matrix.chunk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_shopping_scrap/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r google_shopping_scrap/requirements.txt
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: actions/download-artifact@v4
        with:
          name: chunks-2
          path: chunks
      - name: Run scraper
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!; trap 'kill $XVFB_PID 2>/dev/null || true' EXIT; sleep 2
          mkdir -p outputs
          python -u google_shopping_scrap/collect_set_simple_from_urls_selenium.py \
            --urls "${{ matrix.chunk }}" \
            --out  "outputs/out_${{ matrix.index }}.csv" \
            --pending-out "outputs/pend_${{ matrix.index }}.csv" \
            --flush-every "${{ inputs.flush_every }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-2-${{ matrix.index }}
          path: |
            outputs/out_${{ matrix.index }}.csv
            outputs/pend_${{ matrix.index }}.csv
          if-no-files-found: warn
          retention-days: 5

  aggregate-2:
    needs: process-2
    if: ${{ always() && needs.process-2.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      pending_count: ${{ steps.merge.outputs.pending_count }}
      do_next: ${{ steps.merge.outputs.do_next }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-2-*
          path: all_results
          merge-multiple: true
      - name: Merge wave 2
        id: merge
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          out = Path("wave2"); out.mkdir(exist_ok=True)
          header = None
          success, seen_r, pending, seen_p = [], set(), [], set()
          for root, _, files in os.walk("all_results"):
              for name in files:
                  path = Path(root) / name
                  if name.startswith("out_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          r = csv.reader(f); h = next(r, None)
                          if h and header is None: header = h
                          for row in r:
                              if not row: continue
                              key = tuple(row)
                              if key in seen_r: continue
                              seen_r.add(key); success.append(row)
                  elif name.startswith("pend_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          for row in csv.DictReader(f):
                              u = (row.get("product_url") or row.get("url") or "").strip()
                              if u and u not in seen_p:
                                  seen_p.add(u); pending.append(u)
          with open(out / "success.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(header or ["url","name","image_url","price","seller","pid","cid","gid"])
              w.writerows(success)
          with open(out / "pending.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in pending])
          max_rounds = min(5, max(1, int("${{ inputs.max_pending_rounds }}" or "5")))
          do_next = "true" if (len(pending) > 0 and max_rounds >= 3) else "false"
          print(f"Wave 2: {len(success)} success, {len(pending)} pending → next={do_next}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"pending_count={len(pending)}\n")
              o.write(f"do_next={do_next}\n")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as s:
              s.write(f"### Wave 2\n- success: {len(success)}\n- pending: {len(pending)}\n- do_next: `{do_next}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave-2
          path: wave2/
          retention-days: 5

  # ============================================================
  # WAVE 3
  # ============================================================
  plan-3:
    needs: aggregate-2
    if: ${{ always() && needs.aggregate-2.result == 'success' && needs.aggregate-2.outputs.do_next == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      chunk_count: ${{ steps.chunk.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wave-2
          path: wave2
      - name: Chunk pending
        id: chunk
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
