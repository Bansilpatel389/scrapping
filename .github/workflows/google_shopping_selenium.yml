                  o.write('matrix={"include":[]}\n')
                  o.write("chunk_count=0\n")
              raise SystemExit(0)
          chunk_size = min(MAX_PER_JOB, max(1, math.ceil(n / MAX_JOBS)))
          chunks = [urls[i:i+chunk_size] for i in range(0, n, chunk_size)]
          Path("chunks").mkdir(exist_ok=True)
          matrix = []
          for i, g in enumerate(chunks):
              p = f"chunks/urls_{i}.csv"
              with open(p, "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in g])
              matrix.append({"index": i, "chunk": p, "count": len(g)})
          print(f"Wave 3: {len(matrix)} chunks from {n} pending")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"matrix={json.dumps({'include': matrix})}\n")
              o.write(f"chunk_count={len(matrix)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-3
          path: chunks/
          retention-days: 2

  process-3:
    needs: plan-3
    if: ${{ always() && needs.plan-3.result == 'success' && needs.plan-3.outputs.chunk_count != '0' && needs.plan-3.outputs.chunk_count != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel_jobs) }}
      matrix: ${{ fromJSON(needs.plan-3.outputs.matrix) }}
    env:
      HEADLESS: "1"
      BROWSER_ACCEPT_LANGUAGE: "en-US,en;q=0.9"
      BROWSER_TIMEZONE: "America/New_York"
      AUTOMATION_BLOCK_WAIT: "25"
      AUTOMATION_BLOCK_MAX: "2"
    name: process-3(${{ matrix.index }}, ${{ matrix.chunk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_shopping_scrap/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r google_shopping_scrap/requirements.txt
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: actions/download-artifact@v4
        with:
          name: chunks-3
          path: chunks
      - name: Run scraper
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!; trap 'kill $XVFB_PID 2>/dev/null || true' EXIT; sleep 2
          mkdir -p outputs
          python -u google_shopping_scrap/collect_set_simple_from_urls_selenium.py \
            --urls "${{ matrix.chunk }}" \
            --out  "outputs/out_${{ matrix.index }}.csv" \
            --pending-out "outputs/pend_${{ matrix.index }}.csv" \
            --flush-every "${{ inputs.flush_every }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-3-${{ matrix.index }}
          path: |
            outputs/out_${{ matrix.index }}.csv
            outputs/pend_${{ matrix.index }}.csv
          if-no-files-found: warn
          retention-days: 5

  aggregate-3:
    needs: process-3
    if: ${{ always() && needs.process-3.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      pending_count: ${{ steps.merge.outputs.pending_count }}
      do_next: ${{ steps.merge.outputs.do_next }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-3-*
          path: all_results
          merge-multiple: true
      - name: Merge wave 3
        id: merge
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          out = Path("wave3"); out.mkdir(exist_ok=True)
          header = None
          success, seen_r, pending, seen_p = [], set(), [], set()
          for root, _, files in os.walk("all_results"):
              for name in files:
                  path = Path(root) / name
                  if name.startswith("out_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          r = csv.reader(f); h = next(r, None)
                          if h and header is None: header = h
                          for row in r:
                              if not row: continue
                              key = tuple(row)
                              if key in seen_r: continue
                              seen_r.add(key); success.append(row)
                  elif name.startswith("pend_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          for row in csv.DictReader(f):
                              u = (row.get("product_url") or row.get("url") or "").strip()
                              if u and u not in seen_p:
                                  seen_p.add(u); pending.append(u)
          with open(out / "success.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(header or ["url","name","image_url","price","seller","pid","cid","gid"])
              w.writerows(success)
          with open(out / "pending.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in pending])
          max_rounds = min(5, max(1, int("${{ inputs.max_pending_rounds }}" or "5")))
          do_next = "true" if (len(pending) > 0 and max_rounds >= 4) else "false"
          print(f"Wave 3: {len(success)} success, {len(pending)} pending → next={do_next}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"pending_count={len(pending)}\n")
              o.write(f"do_next={do_next}\n")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as s:
              s.write(f"### Wave 3\n- success: {len(success)}\n- pending: {len(pending)}\n- do_next: `{do_next}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave-3
          path: wave3/
          retention-days: 5

  # ============================================================
  # WAVE 4
  # ============================================================
  plan-4:
    needs: aggregate-3
    if: ${{ always() && needs.aggregate-3.result == 'success' && needs.aggregate-3.outputs.do_next == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      chunk_count: ${{ steps.chunk.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wave-3
          path: wave3
      - name: Chunk pending
        id: chunk
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          MAX_PER_JOB = max(1, int("${{ inputs.urls_per_job }}" or "10"))
          MAX_JOBS    = max(1, int("${{ inputs.max_parallel_jobs }}" or "20"))
          urls = []
          with open("wave3/pending.csv", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  u = (row.get("product_url") or row.get("url") or "").strip()
                  if u: urls.append(u)
          n = len(urls)
          if n == 0:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
                  o.write('matrix={"include":[]}\n')
                  o.write("chunk_count=0\n")
              raise SystemExit(0)
          chunk_size = min(MAX_PER_JOB, max(1, math.ceil(n / MAX_JOBS)))
          chunks = [urls[i:i+chunk_size] for i in range(0, n, chunk_size)]
          Path("chunks").mkdir(exist_ok=True)
          matrix = []
          for i, g in enumerate(chunks):
              p = f"chunks/urls_{i}.csv"
              with open(p, "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in g])
              matrix.append({"index": i, "chunk": p, "count": len(g)})
          print(f"Wave 4: {len(matrix)} chunks from {n} pending")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"matrix={json.dumps({'include': matrix})}\n")
              o.write(f"chunk_count={len(matrix)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-4
          path: chunks/
          retention-days: 2

  process-4:
    needs: plan-4
    if: ${{ always() && needs.plan-4.result == 'success' && needs.plan-4.outputs.chunk_count != '0' && needs.plan-4.outputs.chunk_count != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel_jobs) }}
      matrix: ${{ fromJSON(needs.plan-4.outputs.matrix) }}
    env:
      HEADLESS: "1"
      BROWSER_ACCEPT_LANGUAGE: "en-US,en;q=0.9"
      BROWSER_TIMEZONE: "America/New_York"
      AUTOMATION_BLOCK_WAIT: "30"
      AUTOMATION_BLOCK_MAX: "2"
    name: process-4(${{ matrix.index }}, ${{ matrix.chunk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_shopping_scrap/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r google_shopping_scrap/requirements.txt
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: actions/download-artifact@v4
        with:
          name: chunks-4
          path: chunks
      - name: Run scraper
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!; trap 'kill $XVFB_PID 2>/dev/null || true' EXIT; sleep 2
          mkdir -p outputs
          python -u google_shopping_scrap/collect_set_simple_from_urls_selenium.py \
            --urls "${{ matrix.chunk }}" \
            --out  "outputs/out_${{ matrix.index }}.csv" \
            --pending-out "outputs/pend_${{ matrix.index }}.csv" \
            --flush-every "${{ inputs.flush_every }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-4-${{ matrix.index }}
          path: |
            outputs/out_${{ matrix.index }}.csv
            outputs/pend_${{ matrix.index }}.csv
          if-no-files-found: warn
          retention-days: 5

  aggregate-4:
    needs: process-4
    if: ${{ always() && needs.process-4.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      pending_count: ${{ steps.merge.outputs.pending_count }}
      do_next: ${{ steps.merge.outputs.do_next }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-4-*
          path: all_results
          merge-multiple: true
      - name: Merge wave 4
        id: merge
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          out = Path("wave4"); out.mkdir(exist_ok=True)
          header = None
          success, seen_r, pending, seen_p = [], set(), [], set()
          for root, _, files in os.walk("all_results"):
              for name in files:
                  path = Path(root) / name
                  if name.startswith("out_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          r = csv.reader(f); h = next(r, None)
                          if h and header is None: header = h
                          for row in r:
                              if not row: continue
                              key = tuple(row)
                              if key in seen_r: continue
                              seen_r.add(key); success.append(row)
                  elif name.startswith("pend_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          for row in csv.DictReader(f):
                              u = (row.get("product_url") or row.get("url") or "").strip()
                              if u and u not in seen_p:
                                  seen_p.add(u); pending.append(u)
          with open(out / "success.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(header or ["url","name","image_url","price","seller","pid","cid","gid"])
              w.writerows(success)
          with open(out / "pending.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in pending])
          max_rounds = min(5, max(1, int("${{ inputs.max_pending_rounds }}" or "5")))
          do_next = "true" if (len(pending) > 0 and max_rounds >= 5) else "false"
          print(f"Wave 4: {len(success)} success, {len(pending)} pending → next={do_next}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"pending_count={len(pending)}\n")
              o.write(f"do_next={do_next}\n")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as s:
              s.write(f"### Wave 4\n- success: {len(success)}\n- pending: {len(pending)}\n- do_next: `{do_next}`\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave-4
          path: wave4/
          retention-days: 5

  # ============================================================
  # WAVE 5
  # ============================================================
  plan-5:
    needs: aggregate-4
    if: ${{ always() && needs.aggregate-4.result == 'success' && needs.aggregate-4.outputs.do_next == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.chunk.outputs.matrix }}
      chunk_count: ${{ steps.chunk.outputs.chunk_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wave-4
          path: wave4
      - name: Chunk pending
        id: chunk
        run: |
          python - <<'PY'
          import csv, json, math, os
          from pathlib import Path
          MAX_PER_JOB = max(1, int("${{ inputs.urls_per_job }}" or "10"))
          MAX_JOBS    = max(1, int("${{ inputs.max_parallel_jobs }}" or "20"))
          urls = []
          with open("wave4/pending.csv", encoding="utf-8-sig") as f:
              for row in csv.DictReader(f):
                  u = (row.get("product_url") or row.get("url") or "").strip()
                  if u: urls.append(u)
          n = len(urls)
          if n == 0:
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
                  o.write('matrix={"include":[]}\n')
                  o.write("chunk_count=0\n")
              raise SystemExit(0)
          chunk_size = min(MAX_PER_JOB, max(1, math.ceil(n / MAX_JOBS)))
          chunks = [urls[i:i+chunk_size] for i in range(0, n, chunk_size)]
          Path("chunks").mkdir(exist_ok=True)
          matrix = []
          for i, g in enumerate(chunks):
              p = f"chunks/urls_{i}.csv"
              with open(p, "w", newline="", encoding="utf-8") as f:
                  w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in g])
              matrix.append({"index": i, "chunk": p, "count": len(g)})
          print(f"Wave 5: {len(matrix)} chunks from {n} pending")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"matrix={json.dumps({'include': matrix})}\n")
              o.write(f"chunk_count={len(matrix)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: chunks-5
          path: chunks/
          retention-days: 2

  process-5:
    needs: plan-5
    if: ${{ always() && needs.plan-5.result == 'success' && needs.plan-5.outputs.chunk_count != '0' && needs.plan-5.outputs.chunk_count != '' }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel_jobs) }}
      matrix: ${{ fromJSON(needs.plan-5.outputs.matrix) }}
    env:
      HEADLESS: "1"
      BROWSER_ACCEPT_LANGUAGE: "en-US,en;q=0.9"
      BROWSER_TIMEZONE: "America/New_York"
      AUTOMATION_BLOCK_WAIT: "35"
      AUTOMATION_BLOCK_MAX: "2"
    name: process-5(${{ matrix.index }}, ${{ matrix.chunk }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: google_shopping_scrap/requirements.txt
      - run: python -m pip install --upgrade pip && pip install -r google_shopping_scrap/requirements.txt
      - id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-dependencies: true
      - run: |
          echo "CHROME_BIN=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROME_PATH=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb
      - uses: actions/download-artifact@v4
        with:
          name: chunks-5
          path: chunks
      - name: Run scraper
        env:
          DISPLAY: :99
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 -ac +extension GLX +render -noreset &
          XVFB_PID=$!; trap 'kill $XVFB_PID 2>/dev/null || true' EXIT; sleep 2
          mkdir -p outputs
          python -u google_shopping_scrap/collect_set_simple_from_urls_selenium.py \
            --urls "${{ matrix.chunk }}" \
            --out  "outputs/out_${{ matrix.index }}.csv" \
            --pending-out "outputs/pend_${{ matrix.index }}.csv" \
            --flush-every "${{ inputs.flush_every }}"
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-5-${{ matrix.index }}
          path: |
            outputs/out_${{ matrix.index }}.csv
            outputs/pend_${{ matrix.index }}.csv
          if-no-files-found: warn
          retention-days: 5

  aggregate-5:
    needs: process-5
    if: ${{ always() && needs.process-5.result != 'skipped' }}
    runs-on: ubuntu-latest
    outputs:
      pending_count: ${{ steps.merge.outputs.pending_count }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: result-5-*
          path: all_results
          merge-multiple: true
      - name: Merge wave 5
        id: merge
        run: |
          python - <<'PY'
          import csv, os
          from pathlib import Path
          out = Path("wave5"); out.mkdir(exist_ok=True)
          header = None
          success, seen_r, pending, seen_p = [], set(), [], set()
          for root, _, files in os.walk("all_results"):
              for name in files:
                  path = Path(root) / name
                  if name.startswith("out_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          r = csv.reader(f); h = next(r, None)
                          if h and header is None: header = h
                          for row in r:
                              if not row: continue
                              key = tuple(row)
                              if key in seen_r: continue
                              seen_r.add(key); success.append(row)
                  elif name.startswith("pend_") and name.endswith(".csv"):
                      with open(path, encoding="utf-8-sig") as f:
                          for row in csv.DictReader(f):
                              u = (row.get("product_url") or row.get("url") or "").strip()
                              if u and u not in seen_p:
                                  seen_p.add(u); pending.append(u)
          with open(out / "success.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(header or ["url","name","image_url","price","seller","pid","cid","gid"])
              w.writerows(success)
          with open(out / "pending.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f); w.writerow(["product_url"]); w.writerows([[u] for u in pending])
          print(f"Wave 5 (final retry): {len(success)} success, {len(pending)} pending")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"pending_count={len(pending)}\n")
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as s:
              s.write(f"### Wave 5\n- success: {len(success)}\n- pending: {len(pending)}\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wave-5
          path: wave5/
          retention-days: 5

  # ============================================================
  # FINAL MERGE — decides overall green / red from pending only
  # ============================================================
  final-aggregate:
    needs: [aggregate-1, aggregate-2, aggregate-3, aggregate-4, aggregate-5]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all wave artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wave-*
          path: waves
          merge-multiple: false
          continue-on-error: true

      - name: Merge into final outputs
        id: merge_final
        run: |
          python - <<'PY'
          import csv, os, sys
          from pathlib import Path

          final = Path("final")
          final.mkdir(exist_ok=True)
          header = None
          success, seen_r = [], set()
          last_pending = []

          for wave_num in range(1, 6):
              wave_dir = Path("waves") / f"wave-{wave_num}"
              candidates = list(Path("waves").rglob(f"**/wave{wave_num}/success.csv"))
              candidates += list(Path("waves").rglob(f"**/wave-{wave_num}/success.csv"))
              candidates += [wave_dir / "success.csv"]
              for sp in candidates:
                  if sp.is_file():
                      with open(sp, encoding="utf-8-sig") as f:
                          r = csv.reader(f)
                          h = next(r, None)
                          if h and header is None:
                              header = h
                          for row in r:
                              if not row:
                                  continue
                              key = tuple(row)
                              if key in seen_r:
                                  continue
                              seen_r.add(key)
                              success.append(row)
                      break

              pend_candidates = list(Path("waves").rglob(f"**/wave{wave_num}/pending.csv"))
              pend_candidates += list(Path("waves").rglob(f"**/wave-{wave_num}/pending.csv"))
              pend_candidates += [wave_dir / "pending.csv"]
              for pp in pend_candidates:
                  if pp.is_file():
                      rows = []
                      with open(pp, encoding="utf-8-sig") as f:
                          for row in csv.DictReader(f):
                              u = (row.get("product_url") or row.get("url") or "").strip()
                              if u:
                                  rows.append(u)
                      last_pending = rows
                      break

          seen_p, pending = set(), []
          for u in last_pending:
              if u not in seen_p:
                  seen_p.add(u)
                  pending.append(u)

          with open(final / "collect_set_output.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(header or ["url", "name", "image_url", "price", "seller", "pid", "cid", "gid"])
              w.writerows(success)

          with open(final / "final_pending.csv", "w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow(["product_url"])
              w.writerows([[u] for u in pending])

          print(f"FINAL success rows : {len(success)}")
          print(f"FINAL pending URLs : {len(pending)}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as o:
              o.write(f"pending_count={len(pending)}\n")
              o.write(f"success_count={len(success)}\n")

          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a", encoding="utf-8") as s:
              s.write("### Final result\n")
              s.write(f"- success rows: **{len(success)}**\n")
              s.write(f"- pending URLs: **{len(pending)}**\n")
              if len(pending) == 0:
                  s.write("- status: **SUCCESS** (no pending left)\n")
              else:
                  s.write("- status: **FAILURE** (pending remain after all waves)\n")

          if len(pending) > 0:
              print("Pending URLs remain after all waves → failing the workflow")
              sys.exit(1)
          else:
              print("No pending URLs → workflow succeeds")
              sys.exit(0)
          PY

      - name: Upload final artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: collect_set_outputs
          path: |
            final/collect_set_output.csv
            final/final_pending.csv
          retention-days: 7