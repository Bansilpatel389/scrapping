name: Google Shopping Scraper - No Server

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "CSV path in repository"
        required: true
        default: "gshopping/data/osb_products.csv"
        type: string
      total_chunks:
        description: "Number of parallel chunks"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate input CSV
        run: |
          test -f "${{ inputs.input_file }}" || {
            echo "Input CSV not found: ${{ inputs.input_file }}"
            exit 1
          }

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          TOTAL="${{ inputs.total_chunks }}"

          if ! [[ "$TOTAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "total_chunks must be a positive integer"
            exit 1
          fi

          MATRIX=$(python3 -c "import json; n=int('$TOTAL'); print(json.dumps({'chunk_id': list(range(1,n+1))}, separators=(',',':')))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  scrape:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            gshopping/requirements.txt

      - name: Install Chrome and Xvfb
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          sudo apt-get install -y google-chrome-stable || true
          google-chrome --version || google-chrome-stable --version

      - name: Install Python dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip

          if [ -f "gshopping/requirements.txt" ]; then
            pip install -r gshopping/requirements.txt
          elif [ -f "requirements.txt" ]; then
            pip install -r requirements.txt
          else
            pip install pandas selenium undetected-chromedriver
          fi

      - name: Run chunk ${{ matrix.chunk_id }}
        env:
          DISPLAY: ":99"
          CHROME_BIN: "/usr/bin/google-chrome"
        shell: bash
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /tmp/xvfb.log 2>&1 &
          sleep 3

          python -u gshopping/gscrapperci.py \
            --chunk-id "${{ matrix.chunk_id }}" \
            --total-chunks "${{ inputs.total_chunks }}" \
            --input-file "${{ inputs.input_file }}"

      - name: Upload chunk result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gshopping-chunk-${{ matrix.chunk_id }}
          path: output/
          if-no-files-found: ignore
          retention-days: 7

  merge:
    needs: scrape
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gshopping-chunk-*
          path: downloaded
          merge-multiple: true

      - name: Merge CSV outputs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import pandas as pd

          root = Path("downloaded")
          out = Path("final_output")
          out.mkdir(parents=True, exist_ok=True)

          def merge(pattern, destination, dedupe=None):
              files = list(root.rglob(pattern))
              frames = []

              for file in files:
                  try:
                      df = pd.read_csv(file)
                      if not df.empty:
                          frames.append(df)
                  except Exception as exc:
                      print(f"Skipping {file}: {exc}")

              if not frames:
                  print(f"No files found for {pattern}")
                  return

              result = pd.concat(frames, ignore_index=True)

              if dedupe:
                  cols = [c for c in dedupe if c in result.columns]
                  if cols:
                      result = result.drop_duplicates(subset=cols, keep="last")

              result.to_csv(out / destination, index=False)
              print(f"{destination}: {len(result)} rows")

          merge(
              "product_info_round1_chunk*.csv",
              "merged_products.csv",
              ["product_id"],
          )

          merge(
              "seller_info_round1_chunk*.csv",
              "merged_sellers.csv",
              ["product_id", "seller", "seller_url"],
          )

          merge(
              "gshopping_remaining_round1_chunk*.csv",
              "gshopping_remaining.csv",
              ["product_id"],
          )
          PY

      - name: Upload final merged files
        uses: actions/upload-artifact@v4
        with:
          name: gshopping-final
          path: final_output/
          if-no-files-found: warn
          retention-days: 14