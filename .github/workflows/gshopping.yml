name: Google Shopping Scraper - No Server

on:
  workflow_dispatch:
    inputs:
      input_file:
        description: "CSV path in repository"
        required: true
        default: "gshopping/data/osb_products.csv"
        type: string

      total_chunks:
        description: "Number of parallel chunks"
        required: true
        default: "20"
        type: string

permissions:
  contents: read

jobs:

  # ============================================================
  # PREPARE
  # ============================================================

  prepare:
    runs-on: ubuntu-latest

    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate input CSV
        run: |
          INPUT_FILE="${{ inputs.input_file }}"

          echo "Input file: $INPUT_FILE"

          if [ ! -f "$INPUT_FILE" ]; then
            echo "ERROR: Input CSV not found: $INPUT_FILE"
            echo ""
            echo "Repository contents:"
            ls -lah

            echo ""
            echo "gshopping/data contents:"
            ls -lah gshopping/data/ || true

            exit 1
          fi

          echo "Input CSV found:"
          ls -lh "$INPUT_FILE"

      - name: Build matrix
        id: matrix
        shell: bash
        run: |
          TOTAL="${{ inputs.total_chunks }}"

          if ! [[ "$TOTAL" =~ ^[1-9][0-9]*$ ]]; then
            echo "ERROR: total_chunks must be a positive integer"
            exit 1
          fi

          MATRIX=$(python3 -c "import json; n=int('$TOTAL'); print(json.dumps({'chunk_id': list(range(1,n+1))}, separators=(',',':')))")

          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

          echo "Generated matrix:"
          echo "$MATRIX"


  # ============================================================
  # SCRAPE
  # ============================================================

  scrape:
    needs: prepare

    runs-on: ubuntu-22.04

    timeout-minutes: 360

    strategy:
      fail-fast: false

      # Maximum simultaneous runners.
      # Increase/decrease depending on GitHub concurrency limits.
      max-parallel: 20

      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:

      # ----------------------------------------------------------
      # Checkout
      # ----------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4


      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"


      # ----------------------------------------------------------
      # Chrome dependencies
      # ----------------------------------------------------------

      - name: Install Chrome dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            wget \
            gnupg \
            ca-certificates \
            unzip \
            xvfb \
            libxss1 \
            libnss3 \
            libnspr4 \
            libatk-bridge2.0-0 \
            libgtk-3-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxrandr2 \
            libgbm1 \
            libasound2 \
            fonts-liberation \
            libu2f-udev


      # ----------------------------------------------------------
      # Chrome 146
      # ----------------------------------------------------------

      - name: Install fixed Chrome 146
        run: |
          CHROME_VERSION="146.0.7680.71"

          DOWNLOAD_DIR="/tmp/chrome146"
          ZIP_PATH="/tmp/chrome-${CHROME_VERSION}.zip"

          mkdir -p "$DOWNLOAD_DIR"

          wget -qO "$ZIP_PATH" \
            "https://edgedl.me.gvt1.com/edgedl/chrome/chrome-for-testing/${CHROME_VERSION}/linux64/chrome-linux64.zip"

          unzip -q "$ZIP_PATH" -d "$DOWNLOAD_DIR"

          sudo rm -rf "/opt/google-chrome-${CHROME_VERSION}"

          sudo mv \
            "${DOWNLOAD_DIR}/chrome-linux64" \
            "/opt/google-chrome-${CHROME_VERSION}"

          sudo chmod +x \
            "/opt/google-chrome-${CHROME_VERSION}/chrome"

          sudo ln -sf \
            "/opt/google-chrome-${CHROME_VERSION}/chrome" \
            /usr/bin/google-chrome

          sudo ln -sf \
            "/opt/google-chrome-${CHROME_VERSION}/chrome" \
            /usr/bin/google-chrome-stable

          echo "CHROME_BIN=/opt/google-chrome-${CHROME_VERSION}/chrome" \
            >> "$GITHUB_ENV"

          echo "Chrome installed:"

          google-chrome --version


      # ----------------------------------------------------------
      # Python dependencies
      # ----------------------------------------------------------

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

          # Remove anything pre-installed that could conflict
          python -m pip uninstall -y numpy pandas || true

          # Install our pinned requirements
          python -m pip install \
            --no-cache-dir \
            -r gshopping/requirements.txt

          echo ""
          echo "========================================"
          echo "Installed versions"
          echo "========================================"

          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"
          python -c "import selenium; print('Selenium:', selenium.__version__)"

          echo "========================================"


      # ----------------------------------------------------------
      # Verify environment
      # ----------------------------------------------------------

      - name: Verify scraper environment
        run: |
          echo "Python:"
          python --version

          echo ""
          echo "Chrome:"
          "$CHROME_BIN" --version

          echo ""
          echo "Input CSV:"
          ls -lh "${{ inputs.input_file }}"

          echo ""
          echo "Python packages:"
          python -c "
          import numpy
          import pandas
          import selenium
          import undetected_chromedriver

          print('NumPy:', numpy.__version__)
          print('Pandas:', pandas.__version__)
          print('Selenium:', selenium.__version__)
          print('undetected-chromedriver imported successfully')
          "


      # ----------------------------------------------------------
      # Run scraper
      # ----------------------------------------------------------

      - name: Run chunk ${{ matrix.chunk_id }}
        env:
          DISPLAY: ":99"

        run: |
          echo "========================================"
          echo "Starting Google Shopping Scraper"
          echo "========================================"

          echo "Chunk:"
          echo "${{ matrix.chunk_id }} / ${{ inputs.total_chunks }}"

          echo ""

          echo "Input:"
          echo "${{ inputs.input_file }}"

          echo ""

          echo "Chrome:"
          echo "$CHROME_BIN"

          echo "========================================"

          Xvfb :99 \
            -screen 0 1920x1080x24 \
            > /tmp/xvfb.log 2>&1 &

          XVFB_PID=$!

          echo "Xvfb PID: $XVFB_PID"

          sleep 3

          if ! kill -0 "$XVFB_PID" 2>/dev/null; then
            echo "ERROR: Xvfb failed to start"

            cat /tmp/xvfb.log || true

            exit 1
          fi

          echo "Xvfb running successfully"

          mkdir -p output

          python -u gshopping/gscrapperci.py \
            --chunk-id "${{ matrix.chunk_id }}" \
            --total-chunks "${{ inputs.total_chunks }}" \
            --input-file "${{ inputs.input_file }}"


      # ----------------------------------------------------------
      # Show generated files
      # ----------------------------------------------------------

      - name: Show generated output
        if: always()

        run: |
          echo "========================================"
          echo "Generated files"
          echo "========================================"

          find output \
            -type f \
            -maxdepth 5 \
            -print \
            2>/dev/null || true


      # ----------------------------------------------------------
      # Upload each chunk
      # ----------------------------------------------------------

      - name: Upload chunk result
        if: always()

        uses: actions/upload-artifact@v4

        with:
          name: gshopping-chunk-${{ matrix.chunk_id }}

          path: |
            output/**/*.csv

          if-no-files-found: ignore

          retention-days: 7


  # ============================================================
  # MERGE
  # ============================================================

  merge:
    needs: scrape

    if: always()

    runs-on: ubuntu-22.04

    steps:

      # ----------------------------------------------------------
      # Python
      # ----------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5

        with:
          python-version: "3.10"


      # ----------------------------------------------------------
      # Pandas
      # ----------------------------------------------------------

      - name: Install merge dependencies
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            --no-cache-dir \
            numpy==1.26.4 \
            pandas==2.0.3

          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"


      # ----------------------------------------------------------
      # Download chunk artifacts
      # ----------------------------------------------------------

      - name: Download all chunk artifacts
        uses: actions/download-artifact@v4

        with:
          pattern: gshopping-chunk-*
          path: downloaded
          merge-multiple: true


      # ----------------------------------------------------------
      # Display downloaded files
      # ----------------------------------------------------------

      - name: Show downloaded files
        run: |
          echo "Downloaded chunk files:"

          find downloaded \
            -type f \
            -print \
            2>/dev/null || true


      # ----------------------------------------------------------
      # Merge
      # ----------------------------------------------------------

      - name: Merge CSV outputs
        run: |
          python3 - <<'PY'

          from pathlib import Path

          import pandas as pd


          root = Path("downloaded")
          out = Path("final_output")

          out.mkdir(
              parents=True,
              exist_ok=True
          )


          def merge(
              pattern,
              destination,
              dedupe=None
          ):

              files = list(
                  root.rglob(pattern)
              )

              print()
              print(
                  f"Pattern: {pattern}"
              )

              print(
                  f"Files found: {len(files)}"
              )


              frames = []


              for file in files:

                  print(
                      f"Reading: {file}"
                  )

                  try:

                      df = pd.read_csv(file)

                      if not df.empty:

                          frames.append(df)

                  except Exception as exc:

                      print(
                          f"Skipping {file}: {exc}"
                      )


              if not frames:

                  print(
                      f"No data found for {pattern}"
                  )

                  return


              result = pd.concat(
                  frames,
                  ignore_index=True
              )


              if dedupe:

                  cols = [
                      c
                      for c in dedupe
                      if c in result.columns
                  ]

                  if cols:

                      result = (
                          result
                          .drop_duplicates(
                              subset=cols,
                              keep="last"
                          )
                      )


              destination_path = (
                  out / destination
              )


              result.to_csv(
                  destination_path,
                  index=False
              )


              print(
                  f"Created {destination_path}"
              )

              print(
                  f"Rows: {len(result)}"
              )


          # ==============================================
          # PRODUCTS
          # ==============================================

          merge(
              "product_info_round1_chunk*.csv",
              "merged_products.csv",
              [
                  "product_id"
              ],
          )


          # ==============================================
          # SELLERS
          # ==============================================

          merge(
              "seller_info_round1_chunk*.csv",
              "merged_sellers.csv",
              [
                  "product_id",
                  "seller",
                  "seller_url"
              ],
          )


          # ==============================================
          # REMAINING
          # ==============================================

          merge(
              "gshopping_remaining_round1_chunk*.csv",
              "gshopping_remaining.csv",
              [
                  "product_id"
              ],
          )

          PY


      # ----------------------------------------------------------
      # Show final files
      # ----------------------------------------------------------

      - name: Show final output
        run: |
          echo "========================================"
          echo "FINAL OUTPUT"
          echo "========================================"

          find final_output \
            -type f \
            -print \
            2>/dev/null || true

          echo ""

          for FILE in final_output/*.csv; do

            if [ -f "$FILE" ]; then

              echo "----------------------------------------"
              echo "$FILE"

              wc -l "$FILE"

            fi

          done


      # ----------------------------------------------------------
      # Upload final result
      # ----------------------------------------------------------

      - name: Upload final merged files
        uses: actions/upload-artifact@v4

        with:
          name: gshopping-final

          path: |
            final_output/*.csv

          if-no-files-found: warn

          retention-days: 14